[project]
name = "lab-platform"
version = "0.1.0"
description = "Research Execution Platform for a small bioinformatics laboratory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
lab = "lab_cli.app:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/lab_domain", "packages/lab_registry", "packages/lab_cli"]

[tool.hatch.build.targets.wheel.force-include]
"templates/project" = "lab_cli/_templates/project"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["lab_domain", "lab_registry", "lab_cli"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Import the packages from the source tree, so the suite does not depend on the
# editable install being resolvable (see README, macOS hidden .pth caveat).
pythonpath = ["packages"]
